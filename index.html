<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Everlasting Grade</title>
<style id="appcss">
:root {
  --bg: #0e0b12;
  --card: #181320;
  --line: #2a2234;
  --tx: #e9e3ef;
  --mut: #8f849e;
  --ac: #d9a441;
  --ac2: #b4476b;
  --in: #0e0b12;
  --sh: #130f19;
  --sep: #20192a;
  --glow: #2a1530;
  --on: #1a1209;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
* {
  box-sizing: border-box;
}
html,body {
  margin: 0;
}
body {
  background: radial-gradient(1200px 500px at 50% -100px,var(--glow),var(--bg));
  background-color: var(--bg);
  color: var(--tx);
  font: 15px/1.4 Georgia,'Times New Roman',serif;
  min-height: 100vh;
}
.w {
  max-width: 1040px;
  margin: 0 auto;
  padding: 16px;
}
h1 {
  font-size: 26px;
  letter-spacing: .04em;
  margin: 6px 0 2px;
  font-weight: 400;
}
h1 b {
  color: var(--ac);
}
.sub {
  color: var(--mut);
  font-size: 13px;
  margin-bottom: 14px;
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
button,input,select {
  font: inherit;
  color: var(--tx);
}
.tab,.btn {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
.tab.on {
  background: var(--ac);
  color: var(--on);
  border-color: var(--ac);
}
.bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.bar input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  min-width: 0;
}
.grp {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}
.gh {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  cursor: pointer;
}
.cov {
  width: 44px;
  height: 44px;
  border-radius: 6px;

  display: grid;
  place-items: center;

}
.gt {
  flex: 1;
  min-width: 0;
}
.gt h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}
.gt small {
  color: var(--mut);
}
.avg {
  font: 700 20px sans-serif;
  color: var(--ac);
  min-width: 44px;
  text-align: right;
}
.car {
  color: var(--mut);
  transition: .2s;
}
.open .car {
  transform: rotate(90deg);
}
.sl {
  display: none;
  border-top: 1px solid var(--line);
}
.open .sl {
  display: block;
}
.s {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-bottom: 1px solid var(--sep);
}
.s:last-child {

}
.s .n {

  min-width: 0;

}
.s .g {

}
.r {
  width: 62px;

  padding: 4px;

}

}
.rk {

}
.rk.mg {

}
.rk.ms {
  color: #d6dbe4;
  font-weight: 700;
  text-shadow: 0 0 8px #d6dbe466;
}
.rk.mb {
  color: #d98a4e;
  font-weight: 700;
  text-shadow: 0 0 8px #d98a4e66;
}
.rk.mw {
  color: #ff5a6e;
  font-weight: 700;
  text-shadow: 0 0 8px #ff5a6e66;
}
.s.mg {
  background: linear-gradient(90deg,#f2c14e33,transparent 75%);
  box-shadow: inset 3px 0 #f2c14e;
}
.s.mg .n {
  color: #f6d37a;
}
.s.ms {
  background: linear-gradient(90deg,#d6dbe42b,transparent 75%);
  box-shadow: inset 3px 0 #d6dbe4;
}
.s.ms .n {
  color: #e6eaf0;
}
.s.mb {
  background: linear-gradient(90deg,#d98a4e33,transparent 75%);
  box-shadow: inset 3px 0 #d98a4e;
}
.s.mb .n {
  color: #e8a874;
}
.s.mw {
  background: linear-gradient(90deg,#ff5a6e2b,transparent 75%);
  box-shadow: inset 3px 0 #ff5a6e;
}
.s.mw .n {
  color: #ff8d9a;
}
.x {
  background: none;
  border: 0;
  color: var(--mut);

}
.add {

  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 10px;

}
.add input,.add select {

}
textarea {

  height: 140px;
  background: var(--in);
  color: var(--tx);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  font: 12px monospace;
}
.empty {

  text-align: center;
  padding: 24px;
}
.bar {
  flex-wrap: wrap;
}
.bar input {
  flex: 1 1 150px;
}
.s {
  flex-wrap: wrap;
}
.d {
  flex-basis: 100%;
  color: var(--mut);
  font-size: 13px;
  font-style: italic;
  padding: 0 0 3px 2px;
}
.x {

  padding: 2px 6px;
}
#sheet {

  background: #000a;

}

  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  cursor: pointer;
  text-align: left;
}
#sheet .dg {
  color: #e87a8f;
}
#sheet .cl {

}
#sheet input,#sheet textarea {

  background: var(--in);
  border: 1px solid var(--line);

}

}
#sheet p {

}
.row2 {

  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.gt .d {
  font-size: 12px;
  padding: 2px 0 0;
}
.sub {

}
.sh {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px 4px;

.sh b {

  font-weight: 600;
  font-size: 14px;
  color: var(--ac);
}
.sh small {
  color: var(--mut);
}

}
.cr {
  width: 62px;
  background: var(--in);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px;
  text-align: center;
  font: 13px sans-serif;
}
.cr.has {

}
#toast {

}
.lt .rk.mg {
  color: #b8860b;
  text-shadow: none;
}
.lt .rk.ms {
  color: #7d8696;
  text-shadow: none;
}
.lt .rk.mb {
  color: #b0602a;
  text-shadow: none;
}
.lt .rk.mw {
  color: #d12a42;
  text-shadow: none;
}
.lt .s.mg .n {
  color: #8a6100;
}
.lt .s.ms .n {
  color: #4f5766;
}
.lt .s.mb .n {
  color: #8a4a1c;
}
.lt .s.mw .n {
  color: #b81f35;
}
.st h3 {
  margin: 16px 0 8px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ac);
}
.st h3:first-child {
  margin-top: 4px;
}
.pr {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));

}
.pb {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  cursor: pointer;
  text-align: left;
}

  border-color: var(--ac);
}
.sw {
  display: flex;
  border-radius: 4px;
  overflow: hidden;
  flex: none;
}
.sw i {
  width: 11px;
  height: 22px;
  display: block;
}
.cp {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(110px,1fr));
  gap: 8px;
}
.cp label {
  display: grid;
  gap: 4px;
  font-size: 12px;
  color: var(--mut);
}
.cp input[type=color] {
  width: 100%;
  height: 34px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: none;
}
.gw {
  overflow-x: auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px;
}
.gt2 {
  table-layout: fixed;
  border-collapse: separate;
  border-spacing: 2px;
  font: 12px sans-serif;
  margin: 0 auto;
}
.gt2 th {
  color: var(--mut);
  font-weight: 600;
  padding: 2px 4px;
  white-space: nowrap;
  overflow: hidden;
}
.gt2 thead th {
  width: 46px;
}
.gt2 thead th:first-child {
  width: 36px;
}
.gt2 th:first-child {
  position: sticky;
  left: 0;
  background: var(--card);
  text-align: right;
  z-index: 1;
}
.gt2 thead th {
  color: var(--ac);
  font-size: 11px;
  letter-spacing: .04em;
  cursor: pointer;
}
.gt2 td {
  height: 26px;
  text-align: center;
  border-radius: 4px;
  font-weight: 700;
  cursor: pointer;
}
.gt2 td.un {
  color: var(--mut);
  background: var(--sh);
  font-weight: 400;
}
.gt2 tfoot th {
  color: var(--ac);
}
.gt2 tfoot td {
  font-size: 14px;
  cursor: default;
}
.av.mg {
  color: #f2c14e;
}
.av.ms {
  color: #d6dbe4;
}
.av.mb {
  color: #d98a4e;
}
.av.mw {
  color: #ff5a6e;
}
.lt .av.mg {
  color: #b8860b;
}
.lt .av.ms {
  color: #7d8696;
}
.lt .av.mb {
  color: #b0602a;
}
.lt .av.mw {
  color: #d12a42;
}
.lg {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}
.lg span {
  font: 700 11px sans-serif;
  padding: 2px 7px;
  border-radius: 4px;
}
.by {
  color: var(--mut);
  font-size: 14px;
  font-style: italic;
  margin: 0 0 6px;
}
.by:empty {
  display: none;
}
.tabs {
  flex-wrap: nowrap;
  overflow-x: auto;
}
.tab {
  white-space: nowrap;
  flex: none;
}
.xp {
  flex-basis: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
  gap: 6px;
  padding: 6px 0 4px;
}
.xp label {
  display: grid;
  gap: 2px;
  font-size: 12px;
  color: var(--mut);
}
.xin {
  background: var(--in);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px;
  text-align: center;
  font-family: sans-serif;
}
.xf {
  grid-column: 1/-1;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 13px;
}
.xf b {
  color: var(--ac);
}
.pie {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.pie svg {
  width: 200px;
  height: 200px;
  flex: none;
}
.pl {
  flex: 1 1 220px;
  display: grid;
  gap: 3px;
  font: 13px sans-serif;
}
.pl div {
  display: flex;
  align-items: center;
  gap: 6px;
}
.pl i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: none;
}
.pl span {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tab {
  padding: 6px 9px;
  font-size: 14px;
}
.tg {
  display: inline-block;
  font: 11px sans-serif;
  background: var(--sh);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 6px;
  margin-left: 5px;
  color: var(--ac);
}
@media print {
  :root {
    --bg: #fff!important;
    --card: #fff!important;
    --line: #ccc!important;
    --tx: #000!important;
    --mut: #555!important;
    --ac: #8a5a00!important;
    --in: #fff!important;
    --sh: #f2f2f2!important;
    --sep: #ddd!important;
    --glow: #fff!important;
  }
  body {
    background: #fff!important;
  }
  .tabs,.bar,.add,#toast,#sheet,#bk,.x {
    display: none!important;
  }
  .sl {
    display: block!important;
  }
  .grp {
    break-inside: avoid;
  }
}
.gm {
  background: color-mix(in srgb,var(--ac2) 16%,var(--bg));
  border: 1px solid var(--ac2);
  border-radius: 12px;
  padding: 10px;
}
.gm .tabs {
  background: color-mix(in srgb,var(--ac2) 30%,var(--bg));
  border-radius: 8px;
  padding: 5px;
  margin-bottom: 10px;
}
.bd {
  display: flex;
  gap: 14px;
  min-width: max-content;
}
.bc {
  display: flex;
  flex-direction: column;
  width: 160px;
}
.bh {
  font: 600 12px sans-serif;
  color: var(--ac);
  text-align: center;
  margin-bottom: 6px;
}
.bm {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 6px;
}
.bx {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  font: 12px sans-serif;
  overflow: hidden;
}
.bx>div {
  padding: 4px 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bx>div+div {
  border-top: 1px solid var(--sep);
}
.bx.cur {
  border-color: var(--ac);
  box-shadow: 0 0 0 1px var(--ac);
}
.bw {
  color: var(--ac);
  font-weight: 700;
}
.bl {
  color: var(--mut);
  text-decoration: line-through;
}
.cmr {
  display: grid;
  grid-template-columns: 34px 1fr 1fr;
  gap: 6px;
  align-items: center;
  margin: 2px 0;
}
.cml {
  color: var(--mut);
  font: 12px sans-serif;
}
.cmc {
  padding: 4px 6px;
  border-radius: 6px;

  gap: 6px;
  font: 13px sans-serif;

  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  margin-top: 3px;
}
.cmb i {
  display: block;
  height: 100%;
  border-radius: 3px;
}
.ap .n .g {
  display: none;
}
.sfam {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid var(--sep);
}
.sfam:last-child {
  border: 0;
}
.sfd {
  font: 12px sans-serif;
  color: var(--mut);
}
.sfr {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 8px 4px;
}
.stk {
  flex: none;
  width: 84px;
  text-align: center;
}
.stn {
  font: 700 12px sans-serif;
  margin-top: 6px;
}
.stc {
  position: relative;
  margin: 0 auto;
  width: 72px;
  height: 72px;
  border-radius: 20px;
  border: 5px solid #fff;
  background: radial-gradient(circle at 30% 22%,#fff9 0,#fff0 48%),var(--sc,#888);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  box-shadow: 0 3px 0 #0006,0 7px 10px #0006;
  overflow: hidden;
  transform: rotate(var(--r,-4deg));
}
.stc::after {
  content: "";
  position: absolute;
  top: -25%;
  left: -45%;
  width: 55%;
  height: 150%;
  background: #fff3;
  transform: rotate(20deg);

  width: 100%;
  height: 100%;

  background: transparent;
  border: 3px dashed #666d7a;
  box-shadow: none;
}
.stk.off .stc::after {
  display: none;
}
.stk.off .stc span,.stk.off .stc img {

@media(max-width:600px) {
  .sfam {
    grid-template-columns: 1fr;
  }
}
.hlc {
  transition: background .25s,border-color .25s;
}
.hlc.ok {
  background: #1f6b3b;
  border-color: #4cd27a;
  animation: hlok .5s;
}
.hlc.bad {
  background: #7a2230;
  border-color: #e87a8f;
  animation: hlbad .45s;
}
.hlc.dim {
  opacity: .55;
}
.slideL {
  animation: hlsl .45s ease-out;
}
.fadeIn {
  animation: hlfi .45s ease-out;
}
@keyframes hlok {
  40% {
    transform: scale(1.06);
  }
}
@keyframes hlbad {
  20% {
    transform: translateX(-8px);
  }
  40% {
    transform: translateX(8px);
  }
  60% {
    transform: translateX(-5px);
  }
  80% {
    transform: translateX(5px);
  }
}
@keyframes hlsl {
  from {
    transform: translateX(105%);
  }
  to {
    transform: none;
  }
}
@keyframes hlfi {
  from {
    opacity: 0;
    transform: scale(.9);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.fs {

}
.lk {
